{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block page_title %}{{ title }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card">
      <div class="card-header p-3"><i class="bi bi-person-badge me-2 text-danger"></i>{{ title }}</div>
      <div class="card-body p-4">
        <form method="POST">
          <div class="mb-3">
            <label class="form-label fw-semibold">Full Name <span class="text-danger">*</span></label>
            <input type="text" name="name" class="form-control" required value="{{ coach.name if coach else '' }}">
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Specialization</label>
            <input type="text" name="specialization" class="form-control" placeholder="e.g. Swimming, Athletics"
                   value="{{ coach.specialization if coach else '' }}">
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Email</label>
            <input type="email" name="email" class="form-control" value="{{ coach.email if coach else '' }}">
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Phone</label>
            <input type="text" name="phone" class="form-control" value="{{ coach.phone if coach else '' }}">
          </div>
          <div class="d-flex gap-2 mt-4">
            <button type="submit" class="btn btn-sg px-4">Save Coach</button>
            <a href="{{ url_for('coaches') }}" class="btn btn-outline-secondary px-4">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
