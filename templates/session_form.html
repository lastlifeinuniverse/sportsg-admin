{% extends "base.html" %}
{% block title %}Log Session{% endblock %}
{% block page_title %}Log a Session{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card">
      <div class="card-header p-3"><i class="bi bi-calendar-plus me-2 text-danger"></i>Log a Session</div>
      <div class="card-body p-4">
        <form method="POST">
          <div class="mb-3">
            <label class="form-label fw-semibold">Programme <span class="text-danger">*</span></label>
            <select name="programme_id" class="form-select" required>
              <option value="">— Select Active Programme —</option>
              {% for p in programmes %}
              <option value="{{ p.id }}">{{ p.name }} ({{ p.coach_name or 'No coach' }})</option>
              {% endfor %}
            </select>
          </div>
          <div class="row g-3 mb-3">
            <div class="col-md-7">
              <label class="form-label fw-semibold">Session Date <span class="text-danger">*</span></label>
              <input type="date" name="session_date" class="form-control" required value="{{ today }}">
            </div>
            <div class="col-md-5">
              <label class="form-label fw-semibold">Duration (hours)</label>
              <input type="number" name="duration_hours" class="form-control" step="0.5" min="0.5" value="1.0">
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Attendance by Age Group</label>
            <div class="card border-0" style="background:#f8fafc">
              <div class="card-body p-3">
                <div class="row g-2">
                  {% for ag in age_groups %}
                  <div class="col-6">
                    <label class="form-label small text-muted mb-1">{{ ag }}</label>
                    <input type="number" name="count_{{ ag }}" class="form-control form-control-sm attendance-input"
                           min="0" value="0" placeholder="0">
                  </div>
                  {% endfor %}
                </div>
                <div class="mt-3 pt-2 border-top d-flex justify-content-between align-items-center">
                  <span class="text-muted small fw-semibold">Total Attendees</span>
                  <span class="fw-bold fs-5" id="totalCount">0</span>
                </div>
              </div>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Notes</label>
            <textarea name="notes" class="form-control" rows="2" placeholder="Optional session notes…"></textarea>
          </div>

          <div class="d-flex gap-2 mt-4">
            <button type="submit" class="btn btn-sg px-4">Save Session</button>
            <a href="{{ url_for('sessions') }}" class="btn btn-outline-secondary px-4">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  const inputs = document.querySelectorAll('.attendance-input');
  const total = document.getElementById('totalCount');
  function updateTotal() {
    total.textContent = [...inputs].reduce((s, i) => s + (parseInt(i.value) || 0), 0);
  }
  inputs.forEach(i => i.addEventListener('input', updateTotal));
</script>
{% endblock %}
